[package]
name = "taid-designer"
version = "1.0.0"
description = "Local game asset production workbench"
authors = ["Garden"]
edition = "2021"
default-run = "taid-designer"

[lib]
name = "taid_designer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
dirs = "6"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
